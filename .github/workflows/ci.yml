name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest --cov=src --cov-report=term-missing
      - run: find scripts -maxdepth 1 -type f -name '*.sh' -exec bash -n {} \;
      - run: ./cipher help
